<title>Приёмка семечки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --surface-2:#F5F7F2; --line:#DAE0D7; --ink:#17201B; --muted:#5C6861; --faint:#89938C;
  --side:#15201B; --side-2:#1E2B25; --side-ink:#DDE6DF; --side-muted:#8E9F95;
  --accent:#E3A008; --accent-ink:#2A1F00; --accent-soft:#FBF0CF;
  --ok:#2E7D4F; --ok-soft:#E0F0E5; --warn:#A96400; --warn-soft:#FBEBD1; --crit:#B3392D; --crit-soft:#F8E0DC; --info:#2F5E8C; --info-soft:#E0EAF4;
  --plate-bg:#FFFFFF; --plate-ink:#111111;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 8px 24px rgba(20,30,25,.06);
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Unbounded","Onest",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1310; --surface:#151D19; --surface-2:#1B2520; --line:#29342E; --ink:#E5EBE6; --muted:#A0ACA4; --faint:#748079;
    --side:#090E0C; --side-2:#131C18; --side-ink:#DDE6DF; --side-muted:#7F9087;
    --accent:#F0B429; --accent-ink:#231900; --accent-soft:#3A2E0C;
    --ok:#5DB985; --ok-soft:#163224; --warn:#E3A447; --warn-soft:#382810; --crit:#E57C71; --crit-soft:#3A1C19; --info:#80AEDB; --info-soft:#162838;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1310; --surface:#151D19; --surface-2:#1B2520; --line:#29342E; --ink:#E5EBE6; --muted:#A0ACA4; --faint:#748079;
  --side:#090E0C; --side-2:#131C18; --side-ink:#DDE6DF; --side-muted:#7F9087;
  --accent:#F0B429; --accent-ink:#231900; --accent-soft:#3A2E0C;
  --ok:#5DB985; --ok-soft:#163224; --warn:#E3A447; --warn-soft:#382810; --crit:#E57C71; --crit-soft:#3A1C19; --info:#80AEDB; --info-soft:#162838;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:14px 40px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.topbar{max-width:1320px;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand-name{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.01em}
.demo-badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:3px 9px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-left:auto}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hint{max-width:1320px;margin:0 auto 14px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.hint b{color:var(--ink);font-weight:600}

/* desktop app */
.app{max-width:1320px;margin-inline:auto;display:grid;grid-template-columns:224px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);min-height:720px}
.side{background:var(--side);color:var(--side-ink);padding:18px 12px;display:flex;flex-direction:column;gap:18px}
.side-plant{padding:4px 10px 12px;border-bottom:1px solid var(--side-2)}
.side-plant b{display:block;font-size:14px}
.side-plant span{font-size:12px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:transparent;color:var(--side-ink);text-align:left;padding:9px 10px;border-radius:9px;display:flex;align-items:center;gap:10px;font-weight:500;opacity:.82}
.nav button svg{width:17px;height:17px;flex:none}
.nav button:hover{background:var(--side-2);opacity:1}
.nav button[aria-current="page"]{background:var(--side-2);opacity:1;box-shadow:inset 3px 0 0 var(--accent)}
.nav .count{margin-left:auto;font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px;font-weight:600}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:10px;border-top:1px solid var(--side-2);display:grid;gap:4px}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.main{padding:22px 26px 30px;min-width:0;display:flex;flex-direction:column;gap:20px;background:var(--surface-2)}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px}
.page-head h1{font-size:22px;margin:0;font-weight:700;text-wrap:balance}
.page-head .sub{color:var(--muted);font-size:13px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;font-size:13px}
.btn:hover{border-color:var(--faint)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.04);border-color:var(--accent)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h2{font-size:14px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel h2 .muted{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:4px}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .value{font-family:var(--f-disp);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .value small{font-family:var(--f-ui);font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.kpi .foot{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--accent-soft);border-color:transparent}
.grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)}
.alert .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.alert .ic svg{width:16px;height:16px}
.alert.crit .ic{background:var(--crit-soft);color:var(--crit)}
.alert.warn .ic{background:var(--warn-soft);color:var(--warn)}
.alert.info .ic{background:var(--info-soft);color:var(--info)}
.alert b{font-weight:600}
.alert .t{font-size:13px}
.alert .s{font-size:12px;color:var(--muted)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .axis{fill:var(--muted);font-size:10.5px;font-family:var(--f-ui)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.now{fill:var(--ink)}
.chart .val{fill:var(--ink);font-size:10.5px;font-weight:600;font-family:var(--f-ui)}

/* plate */
.plate{display:inline-flex;align-items:stretch;border:1.5px solid var(--plate-ink);border-radius:5px;background:var(--plate-bg);color:var(--plate-ink);font-family:var(--f-mono);font-weight:600;font-size:12.5px;line-height:1;white-space:nowrap;overflow:hidden}
.plate .n{padding:4px 6px 4px 7px;letter-spacing:.04em}
.plate .r{padding:2px 5px;border-left:1.5px solid var(--plate-ink);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.plate .r i{font-style:normal;font-size:6.5px;letter-spacing:.05em}
.plate.lg{font-size:17px}
.plate.lg .r{font-size:12px}
.plate.lg .r i{font-size:7.5px}

/* queue board */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:160px}
.col-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.col-head .c{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.col-head .sw{width:8px;height:8px;border-radius:50%}
.card{border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:10px;display:grid;gap:8px}
.card.clickable{cursor:pointer}
.card.clickable:hover{border-color:var(--faint)}
.card .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .sup{font-size:12.5px;font-weight:500}
.card .meta{font-size:12px;color:var(--muted)}
.card.me{box-shadow:0 0 0 2px var(--accent)}
.empty{font-size:12.5px;color:var(--faint);padding:8px 2px}

/* table */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr:hover td{background:var(--surface-2)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:41;box-shadow:-10px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.drawer-head .top{display:flex;align-items:center;gap:10px}
.drawer-head .close{margin-left:auto;border:0;background:var(--surface-2);width:32px;height:32px;border-radius:9px;display:grid;place-items:center}
.drawer-head .close svg{width:16px;height:16px}
.drawer-body{padding:16px 20px 24px;overflow-y:auto;display:grid;gap:14px;align-content:start}
.step{border:1px solid var(--line);border-radius:13px;padding:13px 14px;display:grid;gap:10px}
.step.done{background:var(--surface-2)}
.step.locked{opacity:.5}
.step-h{display:flex;align-items:center;gap:10px;font-weight:600}
.step-h .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--surface-2);border:1px solid var(--line)}
.step.done .step-h .n{background:var(--ok);color:#fff;border-color:var(--ok)}
.step-h .right{margin-left:auto}
.scale{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--side);color:var(--side-ink);border-radius:11px;padding:10px 14px}
.scale .disp{font-family:var(--f-mono);font-size:26px;font-weight:600;letter-spacing:.02em;color:var(--accent)}
.scale .disp small{font-size:13px;color:var(--side-muted);margin-left:4px}
.scale .lbl{font-size:11px;color:var(--side-muted);text-transform:uppercase;letter-spacing:.07em}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.field{display:grid;gap:4px}
.field label{font-size:11.5px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-family:var(--f-mono);font-size:14px;width:100%}
.field input:focus{border-color:var(--accent);outline:none}
.calc{background:var(--accent-soft);border-radius:13px;padding:14px;display:grid;gap:8px}
.calc .line{display:flex;justify-content:space-between;font-size:13px}
.calc .line span:first-child{color:var(--muted)}
.calc .total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--faint);padding-top:8px;margin-top:2px}
.calc .total b{font-family:var(--f-disp);font-size:22px;font-weight:600}
.calc .formula{font-size:11.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}

/* phone */
.phone-stage{max-width:1320px;margin-inline:auto;display:flex;justify-content:center;gap:32px;flex-wrap:wrap;align-items:flex-start}
.phone{width:390px;max-width:100%;height:790px;border-radius:46px;background:var(--side);padding:10px;box-shadow:var(--shadow),0 30px 60px rgba(0,0,0,.18)}
.phone-screen{height:100%;border-radius:37px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 6px;font-size:13px;font-weight:600}
.sbar .isl{width:96px;height:26px;background:var(--side);border-radius:20px}
.sbar .icons{display:flex;gap:5px;align-items:center}
.sbar .icons svg{width:15px;height:15px}
.p-body{flex:1;overflow-y:auto;padding:6px 16px 16px;display:grid;gap:12px;align-content:start}
.p-head{display:flex;align-items:center;gap:10px;padding:4px 2px}
.p-head h1{font-size:20px;margin:0;font-weight:700}
.p-head .sub{font-size:12px;color:var(--muted)}
.p-head .av{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding:8px 8px 18px}
.tabbar.two{grid-template-columns:repeat(2,1fr)}
.tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--faint);padding:4px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{color:var(--accent)}
.p-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.p-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-kpis .kpi{border-radius:16px;padding:12px}
.p-kpis .kpi .value{font-size:20px}
.list{display:grid}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .grow{flex:1;min-width:0}
.list .it .grow b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .it .grow span{font-size:12px;color:var(--muted)}
.hero-status{border-radius:20px;padding:18px;display:grid;gap:12px;background:var(--side);color:var(--side-ink)}
.hero-status .big{font-family:var(--f-disp);font-size:44px;font-weight:600;line-height:1;color:var(--accent)}
.hero-status .cap{font-size:13px;color:var(--side-muted)}
.hero-status h2{margin:0;font-size:19px;font-weight:600;color:var(--side-ink);text-wrap:balance}
.timeline{display:grid;gap:0}
.tl{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:12px}
.tl:last-child{padding-bottom:0}
.tl .d{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:2px;justify-self:center;position:relative;z-index:1}
.tl:not(:last-child)::before{content:"";position:absolute;left:10px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl.done .d{background:var(--ok);border-color:var(--ok)}
.tl.done:not(:last-child)::before{background:var(--ok)}
.tl.cur .d{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl b{font-size:13.5px;font-weight:600;display:block}
.tl span{font-size:12px;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 6px;display:grid;gap:2px;justify-items:center}
.slot b{font-size:14px;font-family:var(--f-mono)}
.slot span{font-size:10.5px;color:var(--muted)}
.slot.full{opacity:.4;cursor:not-allowed}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.slot.busy span{color:var(--warn)}
.p-field{display:grid;gap:5px}
.p-field label{font-size:12px;color:var(--muted);font-weight:500}
.p-field input,.p-field select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:15px;width:100%}
.p-btn{border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);width:100%}
.p-btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.side-note{max-width:320px;display:grid;gap:12px;align-content:start;padding-top:20px}
.side-note h3{margin:0;font-size:16px}
.side-note p{margin:0;color:var(--muted);font-size:13.5px}
.side-note ol{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;display:grid;gap:6px}
.side-note ol b{color:var(--ink)}

/* toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60;width:min(460px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .25s ease-out}
.toast svg{width:17px;height:17px;flex:none;color:var(--accent);margin-top:1px}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}}

.settings-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cult{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);display:grid;gap:10px}
.cult h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.cult .season{font-size:12px;color:var(--muted)}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .settings-grid{grid-template-columns:1fr}
}

/* ---------- helpers ---------- */
const f1 = n => n==null||isNaN(n)?'—':n.toLocaleString('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1});

const dur = m => { m=Math.max(0,Math.round(m)); const h=Math.floor(m/60), r=m%60; return h? `${h} ч ${r} мин` : `${r} мин`; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function plate(tr,lg){
  const p = tr.plate; const a=p[0], num=p.slice(1,4), b=p.slice(4);
  return `<span class="plate${lg?' lg':''}" aria-label="Госномер ${esc(p)} ${esc(tr.region)}"><span class="n">${a} ${num} ${b}</span><span class="r">${tr.region}<i>RUS</i></span></span>`;
}
function calc(tr){
  const c = CULT[tr.culture];
  const netto = (tr.gross!=null && tr.tare!=null) ? tr.gross - tr.tare : null;
  const s = tr.s, w = tr.w;
  const sd = s!=null ? Math.max(0,s-c.sb)*100/(100-c.sb) : null;
  const wd = w!=null ? Math.max(0,w-c.wb)*100/(100-c.wb) : null;
  const zach = (netto!=null && sd!=null && wd!=null) ? netto*(1-sd/100)*(1-wd/100) : null;
  return {netto, sd, wd, zach, c};
}

}

  return out;
}

/* ---------- toasts ---------- */
function toast(msg){
  const box=document.getElementById('toasts');

}

/* ---------- chart ---------- */
function chart(small){
  const data=hourly(); const W=small?330:620, H=small?150:220, pl=34, pr=8, pt=18, pb=24;
  const max=Math.max(60, Math.ceil(Math.max(...data.map(d=>d.v))/20)*20);
  const bw=(W-pl-pr)/data.length;
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';
  for(let v=0; v<=max; v+=max/4){ g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl-6}" y="${y(v)+3.5}" text-anchor="end">${Math.round(v)}</text>`; }
  data.forEach((d,i)=>{
    const x=pl+i*bw+bw*0.2, w=bw*0.6, cur=d.h===14;
    if(d.v>0) g+=`<rect class="bar${cur?' now':''}" x="${x}" y="${y(d.v)}" width="${w}" height="${y(0)-y(d.v)}" rx="3"/>`;
    if(d.v>0 && !small) g+=`<text class="val" x="${x+w/2}" y="${y(d.v)-5}" text-anchor="middle">${f1(d.v)}</text>`;
    g+=`<text class="axis" x="${x+w/2}" y="${H-7}" text-anchor="middle">${String(d.h).padStart(2,'0')}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Принято зачётного веса по часам, тонн">${g}</svg></div>`;
}

function supplierRows(){

function slotsFor(day){
  const base=[t(8,0),t(9,20),t(10,40),t(12,0),t(13,20),t(14,40),t(16,0),t(17,20),t(18,40)];
  return base.map((m,i)=>{ let left = day===0 ? (m<=S.now? 0 : [0,0,0,0,0,1,2,3,3][i]) : day===1 ? [1,0,2,3,1,3,2,3,3][i] : [3,3,2,3,3,3,3,3,3][i];
    const taken = S.trips.some(k=>k._bookDay===day && k.slot===m); if(taken) left=Math.max(0,left-1); return {m,left}; });
}

    <div class="p-card" style="display:grid;gap:12px">
      <div class="p-field"><label for="b-sup">Хозяйство</label><select id="b-sup" data-bfield="supplier">${SUP.map(s=>`<option ${s===b.supplier?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
      <div style="display:grid;grid-template-columns:1fr 90px;gap:8px"><div class="p-field"><label for="b-plate">Госномер</label><input id="b-plate" data-bfield="plate" placeholder="А 123 ВС" value="${esc(b.plate)}" autocomplete="off"></div>
      <div class="p-field"><label for="b-reg">Регион</label><input id="b-reg" data-bfield="region" inputmode="numeric" value="${esc(b.region)}"></div></div>
    </div>
    <div class="filters" role="group" aria-label="День">${days.map((d,i)=>`<button class="chip" data-act="bday" data-day="${i}" aria-pressed="${b.day===i}">${d}</button>`).join('')}</div>
    <div class="slots">${slots.map(s=>`<button class="slot ${s.left===0?'full':s.left===1?'busy':''}" data-act="bslot" data-m="${s.m}" ${s.left===0?'disabled':''} aria-pressed="${b.slot===s.m}"><b>${hm(s.m)}</b><span>${s.left===0?'занято':s.left===1?'1 место':'свободно'}</span></button>`).join('')}</div>
    <button class="p-btn" data-act="book" ${b.slot==null?'disabled style="opacity:.5"':''}>Записаться${b.slot!=null?' на '+hm(b.slot):''}</button>
    <div style="font-size:12px;color:var(--muted);text-align:center">Уведомления о вызове придут в Telegram или по SMS</div>`;
}
function driver(){
  return `<div class="phone"><div class="phone-screen">${sbar()}<div class="p-body">${S.driverTab==='my'?driverMy():driverBook()}</div>
    <nav class="tabbar two" aria-label="Разделы">${[['my','Моя машина',I.truck],['book','Запись',I.cal]].map(([k,n,ic])=>`<button data-act="dtab" data-tab="${k}" ${S.driverTab===k?'aria-current="page"':''}>${ic}${n}</button>`).join('')}</nav></div></div>`;
}
function phoneStage(){
  const isOwner=S.mode==='owner';
  const note = isOwner ? `<div class="side-note"><h3>Телефон собственника</h3><p>Картина смены без звонков на весовую: сколько принято, кто стоит в очереди, где теряются деньги на влаге и соре.</p><ol><li>Нажмите <b>«Пригласить»</b> у машины, которая ждёт больше 90 минут.</li><li>Откройте вкладку <b>«Очередь»</b>: машина перешла в работу.</li><li>Переключитесь на <b>«Рабочее место»</b> и завершите её рейс. Цифры сводки обновятся.</li></ol></div>`
   : `<div class="side-note"><h3>Телефон водителя</h3><p>Водитель видит место в очереди и результат анализа. Меньше звонков «когда разгружаться» и споров о весе.</p><ol><li>Перейдите в <b>«Рабочее место»</b> и нажмите <b>«Пригласить следующую»</b> несколько раз, пока не дойдёт очередь машины К 482 МР.</li><li>Вернитесь сюда: статус сменился на «Проезжайте на весовую».</li><li>Во вкладке <b>«Запись»</b> запишите новую машину. Она появится в очереди у приёмщика.</li></ol></div>`;
  return `<div class="phone-stage">${isOwner?owner():driver()}${note}</div>`;
}

/* ---------- shell ---------- */
function render(){
  const modes=[['desktop','Рабочее место',I.desk],['owner','Собственник',I.phone],['driver','Водитель',I.phone]];
  const hint = S.mode==='desktop'
    ? `<span>${I.seed.replace('<svg','<svg width="16" height="16"')}</span><span><b>Демо на вымышленных данных.</b> Откройте «Очередь», пригласите машину на весовую и проведите рейс: снимите вес, внесите анализ, отправьте на выгрузку, снимите тару. Зачётный вес посчитается сам.</span>`
    : `<span>${I.seed.replace('<svg','<svg width="16" height="16"')}</span><span><b>Демо на вымышленных данных.</b> Все три экрана работают с одними данными: действие на одном сразу видно на других.</span>`;
  document.getElementById('app').innerHTML = `<header class="topbar"><div class="brand"><span class="brand-mark">${I.seed.replace('stroke="currentColor"','stroke="#2A1F00"')}</span><span class="brand-name">Приёмка</span></div><span class="demo-badge">демо</span>
    <div class="seg" role="group" aria-label="Режим показа">${modes.map(([k,n,ic])=>`<button data-act="mode" data-mode="${k}" aria-pressed="${S.mode===k}">${ic}${n}</button>`).join('')}</div></header>
    <p class="hint">${hint}</p>
    ${S.mode==='desktop'?desktop():phoneStage()}`;
}

/* ---------- actions ---------- */
function invite(id){
  const x=S.trips.find(k=>k.id===id); if(!x||x.status!=='arrived') return;
  x.status='weigh'; if(x._gross==null) x._gross=36+Math.round(Math.random()*60)/10;
  toast(`Водителю <b>${x.plate.slice(0,1)} ${x.plate.slice(1,4)} ${x.plate.slice(4)}</b> отправлено: «Проезжайте на весовую №1»`);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act, id=+el.dataset.id;
  const x = id ? S.trips.find(k=>k.id===id) : null;
  switch(a){
    case 'mode': S.mode=el.dataset.mode; S.drawer=null; break;
    case 'page': S.page=el.dataset.page; S.drawer=null; if(S.mode!=='desktop') S.mode='desktop'; break;
    case 'otab': S.ownerTab=el.dataset.tab; break;
    case 'dtab': S.driverTab=el.dataset.tab; break;
    case 'filter': S.filter=el.dataset.f; break;
    case 'invite': invite(id); break;
    case 'next': { const q=waiting(); if(q.length) invite(q[0].id); else toast('На площадке никого нет'); break; }
    case 'arrive': x.status='arrived'; x.arrivedAt=S.now; if(x._gross==null){x._gross=36+Math.round(Math.random()*60)/10;} toast(`${x.plate.slice(0,1)} ${x.plate.slice(1,4)} ${x.plate.slice(4)} на площадке, место в очереди ${waiting().findIndex(k=>k.id===x.id)+1}`); break;
    case 'open': S.drawer=id; break;
    case 'close': S.drawer=null; break;
    case 'read': {
      const kind=el.dataset.kind; S.reading={id,kind}; render();
      const disp=document.getElementById('scale-disp'); let n=0;
      const target = kind==='gross' ? (x._gross ?? 39.5) : (x._tare ?? (14.2+Math.round(Math.random()*16)/10));
      const iv=setInterval(()=>{ n++; if(disp) disp.firstChild.nodeValue = f2(target + (Math.random()-.5)*(1.2/n)); if(n>=8){ clearInterval(iv); x[kind]=target; S.reading=null; render(); } },110);
      return;
    }
    case 'tounload': x.status='unload'; if(x._tare==null) x._tare=14.2+Math.round(Math.random()*16)/10; toast('Водителю отправлено: «Выгрузка: завальная яма №2»'); break;
    case 'finish': { x.status='done'; x.finishedAt=S.now; S.now+=2; const c=calc(x); toast(`Рейс завершён. Зачётный вес <b>${f2(c.zach)} т</b>. Акт отправлен водителю и в хозяйство.`); break; }
    case 'sdiz': x.sdiz='redeemed'; toast(`СДИЗ …${x.sdizNo} отмечен погашенным. В рабочей версии — отправка во ФГИС «Зерно».`); break;
    case 'export': { const st=stats(); toast(`Файл для 1С сформирован: ${st.count} рейсов, ${f1(st.zach)} т зачётного веса. В демо файл не скачивается.`); break; }
    case 'act': toast('Акт приёмки сформирован. В рабочей версии уходит поставщику в кабинет и в 1С.'); break;
    case 'bday': S.booking.day=+el.dataset.day; S.booking.slot=null; break;
    case 'bslot': S.booking.slot=+el.dataset.m; break;
    case 'book': {
      const b=S.booking; const raw=b.plate.toUpperCase().replace(/\s/g,'');
      const ok=/^[АВЕКМНОРСТУХ]\d{3}[АВЕКМНОРСТУХ]{2}$/.test(raw);
      if(!ok){ toast('Проверьте госномер: буква, три цифры, две буквы. Например, А 123 ВС.'); return; }
      if(b.slot==null) return;
      const nt=trip({plate:raw,region:b.region||'93',supplier:b.supplier,status:b.day===0?'booked':'future',slot:b.slot,_bookDay:b.day});
      S.trips.push(nt);
      S.driverId=nt.id; S.driverTab='my';
      toast(`Запись подтверждена: ${['сегодня','завтра','30.09'][b.day]} в ${hm(b.slot)}. ${b.day===0?'Машина появилась в очереди у приёмщика.':''}`);
      S.booking={supplier:b.supplier,plate:'',region:b.region,day:b.day,slot:null};
      break;
    }
    default: return;
  }
  render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && S.drawer){ S.drawer=null; render(); }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('.card.clickable')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input',e=>{
  const f=e.target.dataset.field, bf=e.target.dataset.bfield;
  if(f && S.drawer){
    const x=S.trips.find(k=>k.id===S.drawer); const v=parseFloat(String(e.target.value).replace(',','.'));
    x[f]= isNaN(v)? null : v;
    const box=document.getElementById('calc'); if(box) box.innerHTML=calcHtml(x);
    const btn=document.getElementById('btn-unload'); if(btn) btn.disabled = !(x.gross!=null && x.w!=null && x.s!=null && x.oil!=null);
  }
  if(bf){ S.booking[bf]=e.target.value; }
});
document.addEventListener('change',e=>{ if(e.target.dataset.bfield==='supplier'){ S.booking.supplier=e.target.value; } });
render();
})();
</script>
